buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20" // must match RN 0.81.x
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle") // version supplied by RN gradle plugin (8.11.0)
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
         classpath("com.google.gms:google-services:4.4.2")
    }
}

/**
 * Repositories for ALL modules (app + node_modules)
 */
allprojects {
    repositories {
        google()
        mavenCentral()

        // PhonePe SDK repo
        maven {
            url "https://phonepe.mycloudrepo.io/public/repositories/phonepe-intentsdk-android"
        }
    }
}

/**
 *  FIX react-native-video / library lint crash
 */
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") ||
            project.plugins.hasPlugin("com.android.application")) {

            project.android {
                lint {
                    abortOnError false
                    checkReleaseBuilds false
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
